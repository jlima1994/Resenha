<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Processador de Resenha de Escala</title>

<style>
:root {
  color-scheme: light dark;

  --bg: light-dark(#f3f5f7, #101418);
  --surface: light-dark(#ffffff, #171c21);
  --surface2: light-dark(#f7f8fa, #1d2329);
  --text: light-dark(#17202a, #eef2f5);
  --muted: light-dark(#66717c, #aab4bd);
  --border: light-dark(#d8dee4, #303840);
  --accent: light-dark(#1769aa, #5ba7e6);
  --accentText: #ffffff;
  --ok: light-dark(#137333, #71d49a);
  --danger: light-dark(#b3261e, #ff8f88);
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, Helvetica, sans-serif;
  background: var(--bg);
  color: var(--text);
}

header {
  padding: 22px 18px 14px;
  border-bottom: 1px solid var(--border);
}

.header-inner,
main {
  width: min(1000px, calc(100% - 28px));
  margin: auto;
}

h1 {
  margin: 0 0 6px;
  font-size: clamp(22px, 4vw, 32px);
}

.subtitle {
  color: var(--muted);
  margin: 0;
}

main {
  padding: 20px 0 40px;
}

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 18px;
  margin-bottom: 16px;
}

h2 {
  margin: 0 0 14px;
  font-size: 19px;
}

label {
  display: block;
  font-weight: 700;
  margin-bottom: 7px;
}

input[type=file] {
  width: 100%;
  padding: 12px;
  border: 1px dashed var(--border);
  border-radius: 10px;
  background: var(--surface2);
  color: var(--text);
}

button {
  border: 0;
  border-radius: 10px;
  padding: 12px 18px;
  font-weight: 700;
  cursor: pointer;
  background: var(--accent);
  color: var(--accentText);
  font-size: 15px;
}

button.secondary {
  background: var(--surface2);
  color: var(--text);
  border: 1px solid var(--border);
}

button:disabled {
  opacity: .55;
  cursor: not-allowed;
}

.actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 14px;
}

.status {
  margin-top: 12px;
  color: var(--muted);
  min-height: 20px;
}

.warning {
  color: var(--danger);
}

.ok {
  color: var(--ok);
}

.grid {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 12px;
}

.field {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px;
}

.field small {
  display: block;
  color: var(--muted);
  margin-bottom: 5px;
}

.field strong {
  word-break: break-word;
}

.table-wrap {
  overflow-x: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
}

th,
td {
  padding: 10px 8px;
  border-bottom: 1px solid var(--border);
  text-align: left;
}

th {
  color: var(--muted);
  font-size: 13px;
}

.resenha {
  white-space: pre-wrap;
  font-family: Arial, Helvetica, sans-serif;
  line-height: 1.65;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 16px;
  min-height: 150px;
}

.hidden {
  display: none;
}

@media (max-width: 800px) {
  .grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

@media (max-width: 480px) {
  .grid {
    grid-template-columns: 1fr;
  }

  .card {
    padding: 14px;
  }

  button {
    width: 100%;
  }
}
</style>
</head>

<body>

<header>
  <div class="header-inner">

    <h1>Processador de Resenha</h1>

    <p class="subtitle">
      Interpretação automática de escala PDF e geração da resenha.
    </p>

  </div>
</header>

<main>

<!-- =====================================================
     1. PDF
     ===================================================== -->

<section class="card">

  <h2>1. Selecionar escala</h2>

  <label for="pdfFile">
    Arquivo PDF da escala
  </label>

  <input
    id="pdfFile"
    type="file"
    accept="application/pdf,.pdf"
  >

  <div class="actions">

    <button id="readBtn" disabled>
      Interpretar Escala
    </button>

  </div>

  <div id="status" class="status">
    Selecione um PDF para começar.
  </div>

</section>


<!-- =====================================================
     2. DADOS
     ===================================================== -->

<section id="dataCard" class="card hidden">

  <h2>2. Dados interpretados</h2>

  <div class="grid">

    <div class="field">
      <small>Data</small>
      <strong id="data">—</strong>
    </div>

    <div class="field">
      <small>Hora inicial</small>
      <strong id="inicio">—</strong>
    </div>

    <div class="field">
      <small>Hora final</small>
      <strong id="fim">—</strong>
    </div>

    <div class="field">
      <small>Convênio</small>
      <strong id="convenio">—</strong>
    </div>

    <div class="field">
      <small>OPM</small>
      <strong id="opm">—</strong>
    </div>

  </div>


  <h2 style="margin-top:20px;">
    Policiais identificados
  </h2>


  <div class="table-wrap">

    <table>

      <thead>

        <tr>
          <th>#</th>
          <th>Posto / Graduação</th>
          <th>RE</th>
          <th>Nome completo</th>
        </tr>

      </thead>

      <tbody id="policiais"></tbody>

    </table>

  </div>


  <div class="actions">

    <button id="processBtn">
      Processar Resenha
    </button>

  </div>

</section>


<!-- =====================================================
     3. RESENHA
     ===================================================== -->

<section id="resultCard" class="card hidden">

  <h2>3. Resenha</h2>

  <div id="resenha" class="resenha"></div>

  <div class="actions">

    <button id="copyBtn">
      Copiar Resenha
    </button>

    <button id="clearBtn" class="secondary">
      Limpar
    </button>

  </div>

  <div id="copyStatus" class="status"></div>

</section>

</main>


<!-- =====================================================
     PDF.JS
     =====================================================

     IMPORTANTE:
     Esta é a versão clássica do PDF.js.
     Ela cria window.pdfjsLib diretamente.

     Isso evita o problema causado pelo uso de:
     pdf.min.mjs + type="module"
     ===================================================== -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>


<script>

"use strict";


/* =====================================================
   VARIÁVEIS
   ===================================================== */

let escala = null;


/* =====================================================
   ATALHO PARA ELEMENTOS
   ===================================================== */

const $ = id => document.getElementById(id);


/* =====================================================
   CONFIGURAÇÃO DO PDF.JS
   ===================================================== */

if (window.pdfjsLib) {

  window.pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

}


/* =====================================================
   SELEÇÃO DO PDF
   ===================================================== */

$("pdfFile").addEventListener("change", () => {

  const file = $("pdfFile").files[0];

  $("readBtn").disabled = !file;

  if (!file) {

    $("status").textContent =
      "Selecione um PDF para começar.";

    $("status").className = "status";

    return;
  }


  if (
    file.type !== "application/pdf" &&
    !file.name.toLowerCase().endsWith(".pdf")
  ) {

    $("status").textContent =
      "Selecione um arquivo PDF válido.";

    $("status").className =
      "status warning";

    $("readBtn").disabled = true;

    return;
  }


  $("status").textContent =
    "PDF selecionado: " + file.name;

  $("status").className =
    "status";

});


/* =====================================================
   NORMALIZAR TEXTO
   ===================================================== */

function normalizarTexto(texto) {

  return String(texto || "")
    .replace(/\u00a0/g, " ")
    .replace(/[ \t]+/g, " ")
    .trim();

}


/* =====================================================
   CONVÊNIO
   ===================================================== */

function extrairConvenio(linhas, texto) {

  const indice = linhas.findIndex(l =>
    /^Convênio:?$/i.test(l) ||
    /^Convenio:?$/i.test(l)
  );


  if (
    indice >= 0 &&
    linhas[indice + 1]
  ) {

    return normalizarTexto(
      linhas[indice + 1]
    )
      .replace(
        /^\d+\s*[-–—]\s*/,
        ""
      )
      .toUpperCase();

  }


  const match = texto.match(
    /(?:Convênio|Convenio)\s*:?\s*(?:\r?\n\s*)?(\d+\s*[-–—]\s*[^\r\n]+)/i
  );


  if (!match) {
    return "";
  }


  return normalizarTexto(match[1])
    .replace(
      /^\d+\s*[-–—]\s*/,
      ""
    )
    .toUpperCase();

}


/* =====================================================
   OPM
   ===================================================== */

function extrairOPM(linhas, texto) {

  const indice = linhas.findIndex(l =>
    /^OPM Responsável:?$/i.test(l) ||
    /^OPM Responsavel:?$/i.test(l)
  );


  let origem = "";


  if (
    indice >= 0 &&
    linhas[indice + 1]
  ) {

    origem = linhas[indice + 1];

  } else {

    origem = texto;

  }


  const match =
    origem.match(
      /\b(\d+)\.CIA\b/i
    );


  if (!match) {
    return "";
  }


  return match[1] + "ª CIA";

}


/* =====================================================
   ABREVIAR GRADUAÇÃO
   ===================================================== */

function abreviarGraduacao(graduacao) {

  let g =
    normalizarTexto(graduacao)
      .toUpperCase();


  g =
    g.replace(
      /^\d+\.\s*/,
      ""
    );


  if (/^SOLDADO\b/.test(g)) {
    return "SD PM";
  }


  if (/^CABO\b/.test(g)) {
    return "CB PM";
  }


  if (/^3\.?\s*SARGENTO\b/.test(g)) {
    return "3º SGT PM";
  }


  if (/^2\.?\s*SARGENTO\b/.test(g)) {
    return "2º SGT PM";
  }


  if (/^1\.?\s*SARGENTO\b/.test(g)) {
    return "1º SGT PM";
  }


  if (/^SUBTENENTE\b/.test(g)) {
    return "ST PM";
  }


  if (/^ASPIRANTE\b/.test(g)) {
    return "ASP PM";
  }


  if (/^TENENTE-CORONEL\b/.test(g)) {
    return "TC PM";
  }


  if (/^CORONEL\b/.test(g)) {
    return "CEL PM";
  }


  if (/^MAJOR\b/.test(g)) {
    return "MAJ PM";
  }


  if (
    /^CAPITÃO\b/.test(g) ||
    /^CAPITAO\b/.test(g)
  ) {
    return "CAP PM";
  }


  if (/^TENENTE\b/.test(g)) {
    return "TEN PM";
  }


  return g;

}


/* =====================================================
   RECONSTRUIR LINHAS DO PDF
   ===================================================== */

function reconstruirLinhas(items) {

  const grupos = [];


  for (const item of items) {

    if (
      !item.str ||
      !item.str.trim()
    ) {
      continue;
    }


    const texto =
      normalizarTexto(item.str);


    const y =
      Number(
        item.transform?.[5] || 0
      );


    const x =
      Number(
        item.transform?.[4] || 0
      );


    let grupo =
      grupos.find(
        g => Math.abs(g.y - y) <= 3
      );


    if (!grupo) {

      grupo = {
        y,
        items: []
      };

      grupos.push(grupo);

    }


    grupo.items.push({
      texto,
      x
    });

  }


  /*
    PDF possui coordenadas de baixo
    para cima, por isso ordenamos Y
    de forma decrescente.
  */

  grupos.sort(
    (a, b) => b.y - a.y
  );


  return grupos
    .map(grupo => {

      grupo.items.sort(
        (a, b) => a.x - b.x
      );


      return normalizarTexto(
        grupo.items
          .map(item => item.texto)
          .join(" ")
      );

    })
    .filter(Boolean);

}


/* =====================================================
   IDENTIFICAR POLICIAIS
   ===================================================== */

function detectarPoliciais(linhas) {

  const policiais = [];

  const vistos = new Set();


  for (
    let i = 0;
    i < linhas.length;
    i++
  ) {

    let linha =
      normalizarTexto(linhas[i]);


    if (!linha) {
      continue;
    }


    /*
      Remove o número da ordem:

      1 2. SARGENTO PM ...
      2 SOLDADO PM ...
    */

    linha =
      linha.replace(
        /^\d+\s+/,
        ""
      );


    /*
      Procura:

      GRADUAÇÃO
      RE
      NOME
      OPM
    */

    const match =
      linha.match(
        /^(.+?)\s+(\d{5,7}-[A-Z0-9])\s+(.+?)(?=\s+\d{3,}\.BPM\b|$)/i
      );


    if (!match) {
      continue;
    }


    const graduacaoBruta =
      normalizarTexto(match[1]);


    const re =
      match[2].toUpperCase();


    let nome =
      normalizarTexto(match[3]);


    nome =
      nome.replace(
        /\s+\d{3,}\.BPM\b.*$/i,
        ""
      );


    nome =
      nome.replace(
        /\s+\d+\.CIA\b.*$/i,
        ""
      );


    nome =
      nome.trim();


    if (!nome) {
      continue;
    }


    const chave =
      re + "|" +
      nome.toUpperCase();


    if (vistos.has(chave)) {
      continue;
    }


    vistos.add(chave);


    policiais.push({

      graduacao:
        abreviarGraduacao(
          graduacaoBruta
        ),

      re,

      nome:
        nome.toUpperCase()

    });

  }


  /*
    FALLBACK

    Caso o PDF quebre as colunas
    de forma diferente.
  */

  if (!policiais.length) {

    for (
      let i = 0;
      i < linhas.length;
      i++
    ) {

      const linha =
        normalizarTexto(linhas[i]);


      const reMatch =
        linha.match(
          /\b(\d{5,7}-[A-Z0-9])\b/i
        );


      if (!reMatch) {
        continue;
      }


      const re =
        reMatch[1].toUpperCase();


      const antes =
        linha
          .slice(
            0,
            reMatch.index
          )
          .replace(
            /^\d+\s+/,
            ""
          )
          .trim();


      const depois =
        linha
          .slice(
            reMatch.index +
            reMatch[0].length
          )
          .replace(
            /\s+\d{3,}\.BPM.*$/i,
            ""
          )
          .trim();


      if (!antes || !depois) {
        continue;
      }


      const chave =
        re + "|" +
        depois.toUpperCase();


      if (vistos.has(chave)) {
        continue;
      }


      vistos.add(chave);


      policiais.push({

        graduacao:
          abreviarGraduacao(
            antes
          ),

        re,

        nome:
          depois.toUpperCase()

      });

    }

  }


  return policiais;

}


/* =====================================================
   PARSER PRINCIPAL
   ===================================================== */

function parsearTexto(texto) {

  texto =
    texto.replace(
      /\r/g,
      ""
    );


  const linhas =
    texto
      .split("\n")
      .map(normalizarTexto)
      .filter(Boolean);


  /* DATA */

  const dataMatch =
    texto.match(
      /\b(\d{2}\/\d{2}\/\d{4})\b/
    );


  const data =
    dataMatch
      ? dataMatch[1]
      : "";


  /* HORÁRIOS */

  let inicio = "";
  let fim = "";


  const faixa =
    texto.match(
      /(\d{2}\/\d{2}\/\d{4})\s+(\d{2}:\d{2})\s+(\d{2}\/\d{2}\/\d{4})\s+(\d{2}:\d{2})/
    );


  if (faixa) {

    inicio =
      faixa[2];

    fim =
      faixa[4];

  } else {

    /*
      Fallback.
    */

    const horas =
      [
        ...texto.matchAll(
          /\b(\d{2}:\d{2})\b/g
        )
      ]
      .map(m => m[1]);


    inicio =
      horas[0] || "";


    fim =
      horas[1] || "";

  }


  /* CONVÊNIO */

  const convenio =
    extrairConvenio(
      linhas,
      texto
    );


  /* OPM */

  const opm =
    extrairOPM(
      linhas,
      texto
    );


  /* POLICIAIS */

  const policiais =
    detectarPoliciais(
      linhas
    );


  return {

    data,
    inicio,
    fim,
    convenio,
    opm,
    policiais

  };

}


/* =====================================================
   LER PDF
   ===================================================== */

async function lerPdf(file) {

  /*
    Verifica se PDF.js realmente
    está disponível.
  */

  if (!window.pdfjsLib) {

    throw new Error(
      "O leitor PDF não foi carregado. Verifique sua conexão com a internet e recarregue a página."
    );

  }


  const buffer =
    await file.arrayBuffer();


  const pdf =
    await window.pdfjsLib
      .getDocument({
        data: buffer
      })
      .promise;


  let textoCompleto = "";


  for (
    let paginaNumero = 1;
    paginaNumero <= pdf.numPages;
    paginaNumero++
  ) {

    const pagina =
      await pdf.getPage(
        paginaNumero
      );


    const conteudo =
      await pagina.getTextContent();


    const linhas =
      reconstruirLinhas(
        conteudo.items
      );


    textoCompleto +=
      linhas.join("\n") +
      "\n";

  }


  if (!textoCompleto.trim()) {

    throw new Error(
      "Não foi possível extrair texto deste PDF."
    );

  }


  return textoCompleto;

}


/* =====================================================
   MOSTRAR DADOS
   ===================================================== */

function renderizar() {

  $("data").textContent =
    escala.data ||
    "Não identificado";


  $("inicio").textContent =
    escala.inicio ||
    "Não identificado";


  $("fim").textContent =
    escala.fim ||
    "Não identificado";


  $("convenio").textContent =
    escala.convenio ||
    "Não identificado";


  $("opm").textContent =
    escala.opm ||
    "Não identificado";


  $("policiais").innerHTML =
    escala.policiais
      .map(
        (p, i) => `
          <tr>
            <td>${i + 1}</td>
            <td>${p.graduacao}</td>
            <td>${p.re}</td>
            <td>${p.nome}</td>
          </tr>
        `
      )
      .join("");


  $("dataCard")
    .classList
    .remove("hidden");

}


/* =====================================================
   INTERPRETAR ESCALA
   ===================================================== */

$("readBtn").addEventListener(
  "click",
  async () => {

    const file =
      $("pdfFile").files[0];


    if (!file) {
      return;
    }


    $("readBtn").disabled =
      true;


    $("status").textContent =
      "Lendo e interpretando o PDF...";


    $("status").className =
      "status";


    try {

      const texto =
        await lerPdf(file);


      escala =
        parsearTexto(texto);


      renderizar();


      if (
        !escala.policiais.length
      ) {

        $("status").textContent =
          "PDF lido, mas nenhum policial foi identificado automaticamente.";

        $("status").className =
          "status warning";

      } else {

        $("status").textContent =
          "Escala interpretada com sucesso. " +
          escala.policiais.length +
          " policial(is) identificado(s).";

        $("status").className =
          "status ok";

      }

    } catch (erro) {

      console.error(erro);


      $("status").textContent =
        "Erro ao interpretar o PDF: " +
        erro.message;


      $("status").className =
        "status warning";

    } finally {

      $("readBtn").disabled =
        false;

    }

  }
);


/* =====================================================
   PROCESSAR RESENHA
   ===================================================== */

$("processBtn").addEventListener(
  "click",
  () => {

    if (!escala) {
      return;
    }


    const hora =
      h =>
        (h || "")
          .replace(":", "H");


    /*
      Primeira linha:
      CONVÊNIO

      Segunda:
      06H00 ÀS 14H00

      Depois:
      GRADUAÇÃO RE NOME
    */

    const cabecalho =
      escala.convenio || "";


    const horario =
      hora(escala.inicio) +
      " ÀS " +
      hora(escala.fim);


    const linhas =
      escala.policiais.map(
        p =>
          `${p.graduacao} ${p.re} ${p.nome}`
      );


    const texto =
      [
        cabecalho,
        horario,
        ...linhas
      ]
      .filter(Boolean)
      .join("\n");


    $("resenha").textContent =
      texto;


    $("resultCard")
      .classList
      .remove("hidden");


    $("copyStatus").textContent =
      "";

  }
);


/* =====================================================
   COPIAR
   ===================================================== */

$("copyBtn").addEventListener(
  "click",
  async () => {

    const texto =
      $("resenha").textContent;


    if (!texto) {
      return;
    }


    try {

      await navigator
        .clipboard
        .writeText(texto);


      $("copyStatus").textContent =
        "Resenha copiada com sucesso.";


      $("copyStatus").className =
        "status ok";


    } catch (erro) {

      /*
        Fallback para navegadores
        sem Clipboard API.
      */

      const area =
        document.createElement(
          "textarea"
        );


      area.value =
        texto;


      area.style.position =
        "fixed";


      area.style.opacity =
        "0";


      document.body.appendChild(
        area
      );


      area.focus();
      area.select();


      try {

        document.execCommand(
          "copy"
        );


        $("copyStatus").textContent =
          "Resenha copiada com sucesso.";


        $("copyStatus").className =
          "status ok";


      } catch {

        $("copyStatus").textContent =
          "Não foi possível copiar automaticamente.";


        $("copyStatus").className =
          "status warning";

      }


      document.body.removeChild(
        area
      );

    }

  }
);


/* =====================================================
   LIMPAR
   ===================================================== */

$("clearBtn").addEventListener(
  "click",
  () => {

    escala = null;


    $("pdfFile").value =
      "";


    $("readBtn").disabled =
      true;


    $("dataCard")
      .classList
      .add("hidden");


    $("resultCard")
      .classList
      .add("hidden");


    $("policiais").innerHTML =
      "";


    $("resenha").textContent =
      "";


    $("copyStatus").textContent =
      "";


    $("status").textContent =
      "Selecione um PDF para começar.";


    $("status").className =
      "status";

  }
);

</script>
