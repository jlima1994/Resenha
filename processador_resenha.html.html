<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Processador de Resenha de Escala</title>
<style>
:root {
  color-scheme: light dark;
  --bg: light-dark(#f3f5f7, #101418);
  --surface: light-dark(#ffffff, #171c21);
  --surface2: light-dark(#f7f8fa, #1d2329);
  --text: light-dark(#17202a, #eef2f5);
  --muted: light-dark(#66717c, #aab4bd);
  --border: light-dark(#d8dee4, #303840);
  --accent: light-dark(#1769aa, #5ba7e6);
  --accentText: #ffffff;
  --ok: light-dark(#137333, #71d49a);
  --danger: light-dark(#b3261e, #ff8f88);
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, Helvetica, sans-serif;
  background: var(--bg);
  color: var(--text);
}
#app {
  min-height: 100vh;
  background: var(--bg);
}
header {
  padding: 22px 18px 14px;
  border-bottom: 1px solid var(--border);
}
.header-inner, main {
  width: min(1000px, calc(100% - 28px));
  margin: auto;
}
h1 { margin: 0 0 6px; font-size: clamp(22px, 4vw, 32px); }
.subtitle { color: var(--muted); margin: 0; }
main { padding: 20px 0 40px; }
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 18px;
  margin-bottom: 16px;
}
h2 { margin: 0 0 14px; font-size: 19px; }
label { display: block; font-weight: 700; margin-bottom: 7px; }
input[type=file] {
  width: 100%;
  padding: 12px;
  border: 1px dashed var(--border);
  border-radius: 10px;
  background: var(--surface2);
  color: var(--text);
}
button {
  border: 0;
  border-radius: 10px;
  padding: 12px 18px;
  font-weight: 700;
  cursor: pointer;
  background: var(--accent);
  color: var(--accentText);
  font-size: 15px;
}
button.secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
button:disabled { opacity: .55; cursor: not-allowed; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
.status { margin-top: 12px; color: var(--muted); min-height: 20px; }
.grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 12px;
}
.field {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px;
}
.field small { display: block; color: var(--muted); margin-bottom: 5px; }
.field strong { word-break: break-word; }
table { width: 100%; border-collapse: collapse; }
th, td { padding: 10px 8px; border-bottom: 1px solid var(--border); text-align: left; }
th { color: var(--muted); font-size: 13px; }
.resenha {
  white-space: pre-wrap;
  font-family: Arial, Helvetica, sans-serif;
  line-height: 1.65;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 16px;
  min-height: 150px;
}
.hidden { display: none; }
.warning { color: var(--danger); }
.ok { color: var(--ok); }
@media (max-width: 700px) {
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  th, td { font-size: 13px; }
}
@media (max-width: 480px) {
  .grid { grid-template-columns: 1fr; }
  .card { padding: 14px; }
  button { width: 100%; }
}
</style>
</head>
<body>
<div id="app">
<header>
  <div class="header-inner">
    <h1>Processador de Resenha</h1>
    <p class="subtitle">Interpretação de escala PDF e montagem automática da resenha.</p>
  </div>
</header>

<main>
  <section class="card">
    <h2>1. Selecionar escala</h2>
    <label for="pdfFile">Arquivo PDF da escala</label>
    <input id="pdfFile" type="file" accept="application/pdf,.pdf">
    <div class="actions">
      <button id="readBtn" disabled>Interpretar Escala</button>
    </div>
    <div id="status" class="status">Selecione um PDF para começar.</div>
  </section>

  <section id="dataCard" class="card hidden">
    <h2>2. Dados interpretados</h2>
    <div class="grid">
      <div class="field"><small>Data</small><strong id="data">—</strong></div>
      <div class="field"><small>Hora inicial</small><strong id="inicio">—</strong></div>
      <div class="field"><small>Hora final</small><strong id="fim">—</strong></div>
      <div class="field"><small>Convênio</small><strong id="convenio">—</strong></div>
      <div class="field"><small>OPM</small><strong id="opm">—</strong></div>
    </div>

    <h2 style="margin-top:20px;">Policiais</h2>
    <div style="overflow:auto;">
      <table>
        <thead>
          <tr><th>#</th><th>Posto / Graduação</th><th>RE</th><th>Nome completo</th></tr>
        </thead>
        <tbody id="policiais"></tbody>
      </table>
    </div>

    <div class="actions">
      <button id="processBtn">Processar Resenha</button>
    </div>
  </section>

  <section id="resultCard" class="card hidden">
    <h2>3. Resenha</h2>
    <div id="resenha" class="resenha"></div>
    <div class="actions">
      <button id="copyBtn">Copiar Resenha</button>
      <button id="clearBtn" class="secondary">Limpar</button>
    </div>
    <div id="copyStatus" class="status"></div>
  </section>
</main>
</div>

<script>
let escala = null;

const $ = id => document.getElementById(id);

$("pdfFile").addEventListener("change", () => {
  const file = $("pdfFile").files[0];
  $("readBtn").disabled = !file;
  $("status").textContent = file ? "PDF selecionado: " + file.name : "Selecione um PDF para começar.";
  $("status").className = "status";
});

function normalizarTexto(s) {
  return (s || "")
    .replace(/\u00a0/g, " ")
    .replace(/[ \t]+/g, " ")
    .trim();
}

function extrairConvenio(texto) {
  const m = texto.match(/(?:Convênio|Convenio):\\s*(?:\\d+\\s*[-–—]\\s*)?([^\\r\\n]+)/i);
  if (!m) return "";
  return normalizarTexto(m[1]).toUpperCase();
}

function extrairOPM(texto) {
  const m = texto.match(/OPM Responsável:\\s*\\r?\\n?\\s*([^\\r\\n]+)/i);
  if (!m) {
    const m2 = texto.match(/\\d+\\s*[-–—]\\s*[^\\r\\n]*?(\\d+\\.CIA)\\s+PM/i);
    return m2 ? m2[1].replace(".", "ª ").replace(/\\s+/g, " ").trim().toUpperCase() : "";
  }
  const cia = m[1].match(/(\\d+)\\.CIA\\b/i);
  return cia ? cia[1] + "ª CIA" : "";
}

function abreviarGraduacao(g) {
  let s = normalizarTexto(g).toUpperCase();
  s = s.replace(/^\\d+\\.\\s*/, "");
  if (/^SOLDADO\\b/.test(s)) return "SD PM";
  if (/^CABO\\b/.test(s)) return "CB PM";
  if (/^3\\.?\\s*SARGENTO\\b/.test(g.toUpperCase())) return "3º SGT PM";
  if (/^2\\.?\\s*SARGENTO\\b/.test(g.toUpperCase())) return "2º SGT PM";
  if (/^1\\.?\\s*SARGENTO\\b/.test(g.toUpperCase())) return "1º SGT PM";
  if (/^SUBTENENTE\\b/.test(s)) return "ST PM";
  if (/^ASPIRANTE\\b/.test(s)) return "ASP PM";
  if (/^TENENTE\\b/.test(s)) return "TEN PM";
  if (/^CAPITAO\\b/.test(s) || /^CAPITÃO\\b/.test(s)) return "CAP PM";
  if (/^MAJOR\\b/.test(s)) return "MAJ PM";
  if (/^TENENTE-CORONEL\\b/.test(s)) return "TC PM";
  if (/^CORONEL\\b/.test(s)) return "CEL PM";
  return s.replace(/\\bPM\\b/g, "PM");
}

function detectarPoliciais(linhas) {
  const policiais = [];
  const vistos = new Set();
  for (const original of linhas) {
    let linha = normalizarTexto(original).replace(/^\d+\s+/, '');
    if (!linha) continue;
    const m = linha.match(/^(.+?)\s+(\d{5,7}-[A-Z0-9])\s+(.+?)(?=\s+\d{3,}\.BPM\b|$)/i);
    if (!m) continue;
    const graduacaoBruta = m[1].trim();
    const re = m[2].toUpperCase();
    let nome = normalizarTexto(m[3]);
    nome = nome.replace(/\s+\d{3,}\.BPM\b.*$/i, '').replace(/\s+\d+\.CIA\b.*$/i, '').trim();
    if (!nome) continue;
    if (!/PM|SOLDADO|CABO|SARGENTO|TENENTE|CAPIT|MAJOR|CORONEL|SUBTENENTE|ASPIRANTE/i.test(graduacaoBruta)) continue;
    const chave = re + '|' + nome.toUpperCase();
    if (vistos.has(chave)) continue;
    vistos.add(chave);
    policiais.push({ graduacao: abreviarGraduacao(graduacaoBruta), re, nome: nome.toUpperCase() });
  }
  if (!policiais.length) {
    for (const original of linhas) {
      const linha = normalizarTexto(original);
      const m = linha.match(/^(?:\d+\s+)?(.+?)\s+(\d{5,7}-[A-Z0-9])\s+(.+)$/i);
      if (!m) continue;
      const nome = normalizarTexto(m[3]).replace(/\s+\d{3,}\.BPM.*$/i, '').toUpperCase();
      const chave = m[2].toUpperCase() + '|' + nome;
      if (!nome || vistos.has(chave)) continue;
      vistos.add(chave);
      policiais.push({ graduacao: abreviarGraduacao(m[1]), re: m[2].toUpperCase(), nome });
    }
  }
  return policiais;
}

function parsearTexto(texto) {
  texto = texto.replace(/\r/g, '');
  const linhas = texto.split('\n').map(normalizarTexto).filter(Boolean);
  const data = (texto.match(/\b\d{2}\/\d{2}\/\d{4}\b/) || [''])[0];
  const faixa = texto.match(/(\d{2}\/\d{2}\/\d{4})\s+(\d{2}:\d{2})\s+(\d{2}\/\d{2}\/\d{4})\s+(\d{2}:\d{2})/);
  let inicio = faixa ? faixa[2] : '';
  let fim = faixa ? faixa[4] : '';
  if (!inicio || !fim) {
    const horas = [...texto.matchAll(/\b\d{2}:\d{2}\b/g)].map(x => x[0]);
    inicio = inicio || horas[0] || '';
    fim = fim || horas[1] || '';
  }
  const idxConv = linhas.findIndex(l => /^(Convênio|Convenio):?$/i.test(l));
  let convenio = idxConv >= 0 && linhas[idxConv + 1] ? linhas[idxConv + 1] : '';
  if (!convenio) {
    const m = texto.match(/(?:Convênio|Convenio):?\s*(?:\n\s*)?(\d+\s*[-–—]\s*[^\r\n]+)/i);
    convenio = m ? m[1] : '';
  }
  convenio = normalizarTexto(convenio).replace(/^\d+\s*[-–—]\s*/, '').toUpperCase();
  const idxOpm = linhas.findIndex(l => /^(OPM Responsável|OPM Responsavel):?$/i.test(l));
  const opmBase = idxOpm >= 0 ? linhas[idxOpm + 1] || '' : texto;
  const opmMatch = opmBase.match(/\b(\d+)\.CIA\b/i) || texto.match(/\b(\d+)\.CIA\b/i);
  const opm = opmMatch ? opmMatch[1] + 'ª CIA' : '';
  return { data, inicio, fim, convenio, opm, policiais: detectarPoliciais(linhas) };
}

async function lerPdf(file) {
  /*
    O parser abaixo espera que o navegador consiga obter o texto do PDF.
    Para produção, a próxima evolução pode incorporar PDF.js localmente
    para tornar a leitura do PDF independente do ambiente.
  */
  if (window.pdfjsLib) {
    const buffer = await file.arrayBuffer();
    const pdf = await window.pdfjsLib.getDocument({data: buffer}).promise;
    let texto = "";
    for (let p = 1; p <= pdf.numPages; p++) {
      const page = await pdf.getPage(p);
      const content = await page.getTextContent();
      texto += content.items.map(x => x.str).join(" ") + "\\n";
    }
    return texto;
  }
  throw new Error("O leitor PDF ainda não está carregado neste navegador.");
}

function renderizar() {
  $("data").textContent = escala.data || "Não identificado";
  $("inicio").textContent = escala.inicio || "Não identificado";
  $("fim").textContent = escala.fim || "Não identificado";
  $("convenio").textContent = escala.convenio || "Não identificado";
  $("opm").textContent = escala.opm || "Não identificado";

  $("policiais").innerHTML = escala.policiais.map((p, i) =>
    `<tr><td>${i + 1}</td><td>${p.graduacao}</td><td>${p.re}</td><td>${p.nome}</td></tr>`
  ).join("");

  $("dataCard").classList.remove("hidden");
}

$("readBtn").addEventListener("click", async () => {
  const file = $("pdfFile").files[0];
  if (!file) return;

  $("readBtn").disabled = true;
  $("status").textContent = "Interpretando escala...";
  $("status").className = "status";

  try {
    const texto = await lerPdf(file);
    escala = parsearTexto(texto);
    renderizar();

    if (!escala.policiais.length) {
      $("status").textContent = "Escala lida, mas nenhum policial foi identificado automaticamente.";
      $("status").className = "status warning";
    } else {
      $("status").textContent = "Escala interpretada com sucesso.";
      $("status").className = "status ok";
    }
  } catch (e) {
    $("status").textContent = e.message;
    $("status").className = "status warning";
  } finally {
    $("readBtn").disabled = false;
  }
});

$("processBtn").addEventListener("click", () => {
  if (!escala) return;

  const hora = (h) => (h || "").replace(":", "H");
  const cabecalho = "(" + (escala.convenio || "") + ")";
  const horario = hora(escala.inicio) + " ÀS " + hora(escala.fim);

  // Mantém a ordem decrescente conforme a posição dos policiais na escala.
  const linhas = escala.policiais.map(p => `${p.graduacao} ${p.re} ${p.nome}`);
  const texto = [cabecalho, horario, ...linhas].join("\\n");

  $("resenha").textContent = texto;
  $("resultCard").classList.remove("hidden");
  $("copyStatus").textContent = "";
});

$("copyBtn").addEventListener("click", async () => {
  const texto = $("resenha").textContent;
  try {
    await navigator.clipboard.writeText(texto);
    $("copyStatus").textContent = "Resenha copiada.";
    $("copyStatus").className = "status ok";
  } catch {
    $("copyStatus").textContent = "Não foi possível copiar automaticamente.";
    $("copyStatus").className = "status warning";
  }
});

$("clearBtn").addEventListener("click", () => {
  escala = null;
  $("pdfFile").value = "";
  $("readBtn").disabled = true;
  $("dataCard").classList.add("hidden");
  $("resultCard").classList.add("hidden");
  $("status").textContent = "Selecione um PDF para começar.";
  $("status").className = "status";
});
</script>

</body>
</html>
